# Story 9.5's fixture, and it is shaped against the trap that story names.
#
# A fixture whose ONLY finding is the one being fixed cannot tell a rule that
# offers the remedy for credentials from a rule that offers it for everything.
# So this file carries four things at once:
#
#   1. `db` — a mapping-form credential whose value moves cleanly. This one
#      MUST carry a remedy.
#   2. `api` — a list-form credential, `- API_TOKEN=t0ken`. The remedy has to
#      name API_TOKEN, which lives INSIDE the scalar, not the sequence index
#      that addresses it.
#   3. `awkward` — a credential whose value cannot be written as one `.env`
#      line that reads back as itself: it has a leading space, a double quote
#      AND a single quote, so bare, "..." and '...' all read back as something
#      else. The finding and its replace_scalar fix stay; the remedy must NOT
#      be offered, because `composure extract` would refuse it.
#   4. Findings from OTHER rules — the obsolete `version:` (AD-20) and a port
#      collision between `db` and `clash`. Neither may carry a remedy, and
#      that is the assertion a rule offering it for everything fails.
version: "3.8"
services:
  db:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: hunter2
      POSTGRES_USER: shipyard
  api:
    image: api:1
    environment:
      - API_TOKEN=t0ken
      - LOG_LEVEL=debug
  awkward:
    image: awkward:1
    environment:
      SERVICE_SECRET: ' he said "it''s fine"'
  clash:
    image: nginx:1
    ports:
      - "5432:5432"
