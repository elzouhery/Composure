# URI userinfo credentials, and the twelve shapes that look like one and are not.
#
# Story 3.1 extended: the plaintext-credential rule reads the VALUE for a URI
# whose userinfo carries a non-empty password. Everything below `must-not-fire:`
# is a shape that survived the corpus measurement (146 files, 1180 environment
# scalars, 43 of them containing an `@`) and must stay silent. The line numbers
# are asserted in internal/diagnose/rule_credentials_test.go, so a rule that
# went silent everywhere fails this fixture rather than passing it.
services:
  must-fire:
    image: app
    environment:
      DATABASE_URL: postgres://shipyard:hunter2@db:5432/shipyard
      CELERY_BROKER: amqp://guest:guest@rabbit:5672//
      GIT_REMOTE: https://ci-bot:ghp_deadbeefdeadbeef@github.com/acme/app.git
      SQLALCHEMY_CONN: db+postgresql+psycopg://airflow:airflow@postgres/airflow
      MONGO_URI: mongodb+srv://svc:p%40ssw0rd@cluster0.example.net/db
      REDIS_AUTH: redis://:s3cr3t@redis:6379/0
  must-not-fire:
    image: app
    environment:
      # The secret is not in the file. Both interpolation forms.
      BRACED_URL: postgres://user:${DB_PASSWORD}@db:5432/app
      BARE_URL: postgres://user:$DB_PASSWORD@db:5432/app
      # Empty password. Airflow's own quickstart ships this exact line.
      REDIS_NO_AUTH: redis://:@redis:6379/0
      REDIS_EMPTY_PW: redis://default:@redis:6379/0
      # No password: userinfo is a username alone.
      GIT_HTTPS: https://ci-bot@github.com/acme/app.git
      # No scheme. A bare `host:port` pair, a Kafka quorum voter, an email,
      # a Go MySQL DSN, and an option string with an address inside it.
      KAFKA_VOTERS: 1001@127.0.0.1:29093
      ADMIN_EMAIL: ops@example.com
      GREENMAIL_OPTS: -Dgreenmail.users=test@localhost:test -Dgreenmail.verbose
      # A URI with no userinfo at all.
      PLAIN_URL: https://registry.example.com/v2/
      REDIS_URL: redis://redis:6379/0
      # `*_FILE` is the documented right answer and must not be punished.
      DATABASE_URL_FILE: /run/secrets/database_url
      # Deliberately missed, not overlooked: the matcher is anchored at the
      # start of the value, and this credential is buried in an argument
      # string. Unanchoring finds zero extra credentials across the corpus, so
      # it buys no recall for an unmeasured amount of noise. Removing the `^`
      # makes this line fire and this fixture fail, which is the point.
      PSQL_ARGS: --dsn=postgres://user:hunter2@db:5432/app
