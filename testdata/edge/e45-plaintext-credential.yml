# Story 9.3's fixture. Both forms of `environment:` are here, because the
# scalar a list-form entry holds is the WHOLE `NAME=value` and the scalar a
# mapping-form entry holds is the value alone — replacing the first with
# `${VAR}` produces an entry with no `=`, which Compose reads as
# pass-through-by-name. A fixture with only one form cannot tell them apart.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: hunter2   # the literal this story moves
      POSTGRES_USER: "quoted-user"
      ALREADY: ${FROM_ENV}
  api:
    image: api:1
    environment:
      - API_TOKEN=t0ken
      - LOG_LEVEL=debug
