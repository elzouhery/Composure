# A mapping key at YAML's implicit-key limit: exactly 1024 characters, which is
# the longest key a parser will read. One more and yaml.v3 stops at `could not
# find expected ':'` while goccy carries on regardless — a disagreement that let
# `composure add -kind service -name <1030 chars>` write a compose file the rest of
# this product could not read, and exit 0 saying "2 lines added".
#
# The fixture pins the LEGAL side of the boundary: a key this long is valid, is
# spliced into like any other, and must keep round-tripping. The illegal side is
# a refusal and has no file, because a file holding it would not parse.
services:
  :
    image: nginx
  web:
    image: nginx
