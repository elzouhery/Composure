# A flow-style sequence: two entries on ONE LINE.
#
# This is the shape that defeats `disowned()` in internal/diagnose. That guard
# compares a LINE NUMBER against a BYTE OFFSET, so two candidate nodes sharing
# a line are indistinguishable to it by construction. localPath refusing on an
# ambiguous Origin is the only defence, and removing it ships a replace_scalar
# over `A=1` while the credential stays in the file.
services:
  web:
    image: nginx
    environment: [A=1, SECRET=hunter2]
