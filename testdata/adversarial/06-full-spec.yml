name: full-spec-stack

include:
  - path: ./common/compose.base.yaml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VERSION: ${VERSION:-dev}
      secrets:
        - npm_token
    profiles: ["prod", "staging"]
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
      restart_policy:
        condition: on-failure
        max_attempts: 3
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    cap_add: [NET_ADMIN]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 20000
        hard: 40000
    tmpfs:
      - /run
    extra_hosts:
      - "internal.example.com:10.0.0.5"
    dns:
      - 1.1.1.1
    user: "1000:1000"
    working_dir: /srv/app
    env_file:
      - .env
      - .env.local
    pull_policy: always
    develop:
      watch:
        - action: sync
          path: ./src
          target: /srv/app/src

secrets:
  npm_token:
    file: ./secrets/npm_token.txt

configs:
  nginx_conf:
    file: ./nginx.conf
