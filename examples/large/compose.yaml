# 500 services, for the N3 performance check: a resolved topology must
# open in under two seconds. Named compose.yaml so the extension actually
# activates on it — testdata/ fixtures are named for the engine harness,
# not for Compose, so none of them trigger activation.
# 500 services. The performance fixture for story 4.1 (resolve and first
# paint inside two seconds) and, from here on, a permanent regression file:
# the structural benchmarks sweep testdata/edge, so a splice that degrades on
# a large document fails the gate rather than surprising someone later.
#
# Generated, block style throughout, no anchors — the size is the point, not
# the syntax. Adversarial shapes live in testdata/adversarial/.

services:
